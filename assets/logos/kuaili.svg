<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded container background -->
  <rect width="200" height="200" rx="42" fill="#ffffff"/>
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="100" cy="92" r="54" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  
  <!-- Core emblem circle -->
  <circle cx="100" cy="92" r="44" fill="#ffffff" opacity="0.95"/>
  
  <!-- Brand character -->
  <text x="100" y="107" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="44" font-weight="900" fill="#fb923c" text-anchor="middle">狸</text>
  
  <!-- Brand title badge -->
  <rect x="35" y="152" width="130" height="28" rx="14" fill="#ffffff" opacity="0.9"/>
  <text x="100" y="171" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="800" fill="#1e293b" text-anchor="middle">快狸</text>
</svg>